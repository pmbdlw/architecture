# 只写本服务特有的配置；平台默认值见 acme-framework 各 starter 的 META-INF/acme/defaults/*.yml
spring:
  application:
    name: user-service
  config:
    import:
      # Nacos 中的共享配置与本服务配置（命名空间 = 环境），后者优先级更高
      - optional:nacos:acme-common.yaml
      - optional:nacos:${spring.application.name}.yaml
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/acme_user?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}

server:
  # 本地开发端口；K8s 中统一由环境变量注入 8080 / 8081
  port: ${SERVER_PORT:8101}

management:
  server:
    port: ${MANAGEMENT_PORT:9101}
