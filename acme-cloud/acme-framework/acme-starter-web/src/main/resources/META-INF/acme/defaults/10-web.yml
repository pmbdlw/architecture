server:
  port: ${SERVER_PORT:8080}
  # 网关在前面处理 TLS，服务内部只走 HTTP；保留真实客户端 IP
  forward-headers-strategy: framework

spring:
  mvc:
    problemdetails:
      # 统一使用 Result 响应体，不使用 RFC 9457 ProblemDetail
      enabled: false

springdoc:
  api-docs:
    # 生产环境通过环境变量 API_DOCS_ENABLED=false 关闭
    enabled: ${API_DOCS_ENABLED:true}
  swagger-ui:
    enabled: ${API_DOCS_ENABLED:true}

acme:
  web:
    # 响应头 X-Served-By 返回处理实例（观察负载均衡 / 灰度用），会暴露 Pod 名，仅本地集群与测试环境开启
    served-by-header: ${SERVED_BY_HEADER:false}
