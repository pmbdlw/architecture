# ---- @AcmeServiceTest 使用的测试配置 ----
spring.cloud.nacos.discovery.enabled=false
spring.cloud.nacos.config.enabled=false
spring.cloud.nacos.config.import-check.enabled=false
spring.cloud.service-registry.auto-registration.enabled=false

# H2 的 MySQL 兼容模式直接执行 db/migration/mysql 下的真实脚本
spring.datasource.url=jdbc:h2:mem:${random.uuid};MODE=MySQL;DATABASE_TO_LOWER=TRUE;NON_KEYWORDS=VALUE,USER
spring.datasource.username=sa
spring.datasource.password=
spring.flyway.locations=classpath:db/migration/mysql

# 消息走进程内 Test Binder；发件箱由测试手动触发
spring.cloud.stream.default-binder=integration
acme.mq.outbox.relay-enabled=false
acme.mq.outbox.lock-clause=FOR UPDATE

management.server.port=0
management.tracing.export.enabled=false
