# =====================================================================
# 平台默认配置（优先级最低，可被 application.yml / Nacos / 环境变量覆盖）
# 环境差异一律通过 K8s 注入的环境变量 + Nacos 命名空间表达，镜像本身与环境无关。
# =====================================================================
spring:
  lifecycle:
    # 收到 SIGTERM 后最多等待 30s 处理完存量请求（需小于 Pod terminationGracePeriodSeconds）
    timeout-per-shutdown-phase: 30s
  cloud:
    nacos:
      server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
      username: ${NACOS_USERNAME:nacos}
      password: ${NACOS_PASSWORD:nacos}
      discovery:
        # 命名空间 = 环境：test / staging / prod；本地开发为空（public）
        namespace: ${NACOS_NAMESPACE:}
        group: ${NACOS_GROUP:DEFAULT_GROUP}
        metadata:
          # 灰度标签与版本号来自 Deployment 的环境变量，LoadBalancer 按它路由
          gray-tag: ${GRAY_TAG:}
          version: ${APP_VERSION:dev}
          zone: ${APP_ZONE:}
      config:
        namespace: ${NACOS_NAMESPACE:}
        group: ${NACOS_GROUP:DEFAULT_GROUP}
        file-extension: yaml

server:
  shutdown: graceful

management:
  server:
    # 管理端口与业务端口分离：Ingress/网关只暴露 8080，Prometheus 与探针走 8081
    port: ${MANAGEMENT_PORT:8081}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  info:
    git:
      mode: simple
  metrics:
    tags:
      application: ${spring.application.name}
      env: ${APP_ENV:local}
  tracing:
    sampling:
      # 生产按量调整（如 0.1），test / staging 可设为 1.0
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
    baggage:
      remote-fields: x-gray-tag
      correlation:
        fields: x-gray-tag
  opentelemetry:
    tracing:
      export:
        otlp:
          # 自建：OTel Collector；阿里云：ARMS OTLP 接入点（由环境变量注入）
          endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}

logging:
  # 日志中带上 traceId/spanId，与链路系统互相跳转
  pattern:
    correlation: "[${spring.application.name:},%X{traceId:-},%X{spanId:-}] "
  # K8s 中通过环境变量 LOGGING_STRUCTURED_FORMAT_CONSOLE=ecs 输出 JSON，供 Loki/ELK/SLS 采集
