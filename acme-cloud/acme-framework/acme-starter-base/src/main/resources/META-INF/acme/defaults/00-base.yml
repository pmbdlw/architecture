# =====================================================================
# 平台默认配置（优先级最低，可被 application.yml / Nacos / 环境变量覆盖）
# 环境差异一律通过 K8s 注入的环境变量 + Nacos 命名空间表达，镜像本身与环境无关。
# =====================================================================
spring:
  lifecycle:
    # 收到 SIGTERM 后最多等待 30s 处理完存量请求（需小于 Pod terminationGracePeriodSeconds）
    timeout-per-shutdown-phase: 30s
  cloud:
    loadbalancer:
      cache:
        # 实例列表本地缓存时间（默认 35s）。实例列表由 Nacos 推送到本地，缩短 TTL 几乎没有开销，
        # 但能让实例上下线、灰度实例加入在几秒内生效
        ttl: 2s
    nacos:
      server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
      username: ${NACOS_USERNAME:nacos}
      password: ${NACOS_PASSWORD:nacos}
      discovery:
        # 命名空间 = 环境：test / staging / prod；本地开发为空（public）
        namespace: ${NACOS_NAMESPACE:}
        group: ${NACOS_GROUP:DEFAULT_GROUP}
        metadata:
          # 灰度标签与版本号来自 Deployment 的环境变量，LoadBalancer 按它路由
          gray-tag: ${GRAY_TAG:}
          version: ${APP_VERSION:dev}
          zone: ${APP_ZONE:}
      config:
        namespace: ${NACOS_NAMESPACE:}
        group: ${NACOS_GROUP:DEFAULT_GROUP}
        file-extension: yaml

server:
  shutdown: graceful

acme:
  shutdown:
    # 注销后继续服务的时间：覆盖 Nacos 推送 + LoadBalancer 缓存 TTL，滚动发布零失败请求
    drain-delay: 5s

management:
  server:
    # 管理端口与业务端口分离：Ingress/网关只暴露 8080，Prometheus 与探针走 8081
    port: ${MANAGEMENT_PORT:8081}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  info:
    git:
      mode: simple
  metrics:
    tags:
      application: ${spring.application.name}
      env: ${APP_ENV:local}
    distribution:
      # 输出直方图桶，Prometheus 才能按任意分位数（P95 / P99）聚合多个实例的延迟
      percentiles-histogram:
        http.server.requests: true
  observations:
    enable:
      # Spring Security 的过滤器链观测会给每个请求增加 5~6 个 Span，链路图里只保留业务相关的部分
      spring.security: false
  tracing:
    sampling:
      # 生产按量调整（如 0.1），test / staging 可设为 1.0
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
    baggage:
      remote-fields: x-gray-tag
      correlation:
        fields: x-gray-tag
  otlp:
    metrics:
      export:
        # 指标由 Prometheus 从管理端口拉取；关闭 OTLP 推送（否则每分钟向 localhost:4318 推送失败）
        enabled: false
  opentelemetry:
    tracing:
      export:
        otlp:
          # 自建：OTel Collector；阿里云：ARMS OTLP 接入点（由环境变量注入）
          endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}

logging:
  # 日志中带上 traceId/spanId，与链路系统互相跳转
  pattern:
    correlation: "[${spring.application.name:},%X{traceId:-},%X{spanId:-}] "
  # K8s 中通过环境变量 LOGGING_STRUCTURED_FORMAT_CONSOLE=ecs 输出 JSON，供 Loki/ELK/SLS 采集
