spring:
  cloud:
    stream:
      kafka:
        binder:
          brokers: ${KAFKA_BROKERS:127.0.0.1:9092}
          # topic 由平台通过 IaC / Strimzi KafkaTopic / 云控制台创建，应用不自动建 topic
          auto-create-topics: ${KAFKA_AUTO_CREATE_TOPICS:false}
          required-acks: all
          producer-properties:
            enable.idempotence: true
  rabbitmq:
    addresses: ${RABBITMQ_ADDRESSES:127.0.0.1:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: ${RABBITMQ_VHOST:/}
