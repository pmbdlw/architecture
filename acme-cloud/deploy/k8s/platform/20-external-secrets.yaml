# 敏感配置不进 Git、不进 Nacos：由 External Secrets Operator 从密钥管理系统同步为 K8s Secret。
#   自建：HashiCorp Vault            阿里云：KMS 凭据管家（Secrets Manager）
#   AWS：Secrets Manager             Azure：Key Vault
---
# 方案 A：Vault
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: acme-vault
  namespace: acme
spec:
  provider:
    vault:
      server: https://vault.acme.internal:8200
      path: kv
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: acme
---
# 方案 B：阿里云 KMS 凭据管家（通过 RRSA 免 AK）
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: acme-aliyun-kms
  namespace: acme
spec:
  provider:
    alibaba:
      regionID: cn-hangzhou
      auth:
        rrsa:
          oidcProviderArn: acs:ram::1234567890:oidc-provider/ack-rrsa-xxxx
          oidcTokenFilePath: /var/run/secrets/tokens/oidc-token
          roleArn: acs:ram::1234567890:role/acme-external-secrets
          sessionName: acme-external-secrets
---
# 每个服务一个 ExternalSecret，生成 Helm values 中引用的 <service>-secrets
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: order-service-secrets
  namespace: acme
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: acme-vault          # 阿里云方案改为 acme-aliyun-kms
  target:
    name: order-service-secrets
  data:
    - secretKey: DB_URL
      remoteRef:
        key: acme/order-service
        property: db_url
    - secretKey: DB_USERNAME
      remoteRef:
        key: acme/order-service
        property: db_username
    - secretKey: DB_PASSWORD
      remoteRef:
        key: acme/order-service
        property: db_password
    - secretKey: NACOS_PASSWORD
      remoteRef:
        key: acme/platform
        property: nacos_password
