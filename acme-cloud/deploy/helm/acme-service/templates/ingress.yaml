{{- if and .Values.ingress.enabled (not .Values.grayTag) }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "acme.name" . }}
  labels:
    {{- include "acme.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ .host }}
      http:
        paths:
          - path: {{ .path | default "/" }}
            pathType: Prefix
            backend:
              service:
                name: {{ include "acme.name" $ }}
                port:
                  name: http
    {{- end }}
{{- end }}
