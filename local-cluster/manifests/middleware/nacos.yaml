# Nacos 3.1 单机（注册中心 + 配置中心）。生产：3 节点集群 + 外置 MySQL / 阿里云 MSE Nacos。
# 控制台：http://localhost:30848（nacos / local-only）
apiVersion: v1
kind: Secret
metadata:
  name: nacos-auth
  namespace: middleware
stringData:
  # 仅本地使用的固定值，任何共享环境都必须替换
  NACOS_AUTH_TOKEN: "YWNtZS1sb2NhbC1kZXYtb25seS10b2tlbi1rZXktMzJieXRlcy0hISE="
  NACOS_AUTH_IDENTITY_KEY: acme
  NACOS_AUTH_IDENTITY_VALUE: acme-local
  NACOS_ADMIN_PASSWORD: local-only
---
apiVersion: v1
kind: Service
metadata:
  name: nacos
  namespace: middleware
spec:
  type: NodePort
  selector: { app: nacos }
  ports:
    - { name: http, port: 8848 }
    # 客户端 gRPC 端口 = HTTP 端口 + 1000，必须暴露
    - { name: grpc, port: 9848 }
    - { name: console, port: 8080, nodePort: 30848 }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: nacos
  namespace: middleware
spec:
  serviceName: nacos
  replicas: 1
  selector:
    matchLabels: { app: nacos }
  template:
    metadata:
      labels: { app: nacos }
    spec:
      enableServiceLinks: false
      containers:
        - name: nacos
          image: nacos/nacos-server:v3.1.1
          env:
            - { name: MODE, value: standalone }
            - { name: NACOS_AUTH_ENABLE, value: "true" }
            - { name: JVM_XMS, value: 256m }
            - { name: JVM_XMX, value: 384m }
            - { name: JVM_XMN, value: 128m }
          envFrom:
            - secretRef: { name: nacos-auth }
          ports:
            - { name: http, containerPort: 8848 }
            - { name: grpc, containerPort: 9848 }
            - { name: console, containerPort: 8080 }
          readinessProbe:
            httpGet: { path: /v3/console/health/readiness, port: console }
            periodSeconds: 5
            failureThreshold: 60
          resources:
            requests: { cpu: 100m, memory: 512Mi }
            limits: { memory: 768Mi }
          volumeMounts:
            - { name: data, mountPath: /home/nacos/data }
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests: { storage: 1Gi }
