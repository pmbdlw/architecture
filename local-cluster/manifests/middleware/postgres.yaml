# PostgreSQL 17 单实例（DB=postgres 时使用；生产：Patroni / 阿里云 RDS PostgreSQL / PolarDB PG）。
# 每个服务一个库，库的 owner 即服务账号，只能访问自己的库。
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  namespace: middleware
data:
  init.sql: |
    CREATE USER user_svc PASSWORD 'local-only';
    CREATE USER order_svc PASSWORD 'local-only';
    CREATE USER notification_svc PASSWORD 'local-only';
    CREATE DATABASE acme_user OWNER user_svc;
    CREATE DATABASE acme_order OWNER order_svc;
    CREATE DATABASE acme_notification OWNER notification_svc;
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: middleware
spec:
  selector: { app: postgres }
  ports:
    - { name: postgres, port: 5432 }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: middleware
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels: { app: postgres }
  template:
    metadata:
      labels: { app: postgres }
    spec:
      containers:
        - name: postgres
          image: postgres:17
          env:
            - { name: POSTGRES_PASSWORD, value: postgres }
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
          ports:
            - { name: postgres, containerPort: 5432 }
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres"]
            periodSeconds: 5
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 512Mi }
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
            - { name: init, mountPath: /docker-entrypoint-initdb.d }
      volumes:
        - name: init
          configMap: { name: postgres-init }
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests: { storage: 2Gi }
