# Kafka 4.1 单节点（KRaft，无 ZooKeeper）。生产：Strimzi 3 Broker 跨可用区 / 阿里云消息队列 Kafka 版。
# 关闭自动建 topic：topic 由平台创建（见 kafka-topics Job），与生产流程一致。
apiVersion: v1
kind: Service
metadata:
  name: kafka
  namespace: middleware
spec:
  selector: { app: kafka }
  ports:
    - { name: kafka, port: 9092 }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
  namespace: middleware
spec:
  serviceName: kafka
  replicas: 1
  selector:
    matchLabels: { app: kafka }
  template:
    metadata:
      labels: { app: kafka }
    spec:
      # 关闭 Service 环境变量注入：否则 K8s 注入的 KAFKA_PORT=tcp://... 会被镜像当成 Kafka 配置项
      enableServiceLinks: false
      containers:
        - name: kafka
          image: apache/kafka:4.1.0
          env:
            - { name: KAFKA_NODE_ID, value: "1" }
            - { name: KAFKA_PROCESS_ROLES, value: "broker,controller" }
            - { name: KAFKA_LISTENERS, value: "PLAINTEXT://:9092,CONTROLLER://:9093" }
            - { name: KAFKA_ADVERTISED_LISTENERS, value: "PLAINTEXT://kafka.middleware.svc.cluster.local:9092" }
            - { name: KAFKA_CONTROLLER_LISTENER_NAMES, value: CONTROLLER }
            - { name: KAFKA_CONTROLLER_QUORUM_VOTERS, value: "1@localhost:9093" }
            - { name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR, value: "1" }
            - { name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR, value: "1" }
            - { name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR, value: "1" }
            - { name: KAFKA_AUTO_CREATE_TOPICS_ENABLE, value: "false" }
            - { name: KAFKA_LOG_DIRS, value: /var/lib/kafka/data }
            - { name: KAFKA_HEAP_OPTS, value: "-Xms256m -Xmx384m" }
          ports:
            - { name: kafka, containerPort: 9092 }
          readinessProbe:
            tcpSocket: { port: 9092 }
            periodSeconds: 5
          resources:
            requests: { cpu: 100m, memory: 512Mi }
            limits: { memory: 768Mi }
          volumeMounts:
            - { name: data, mountPath: /var/lib/kafka/data }
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests: { storage: 2Gi }
---
# 平台创建 topic：分区数决定消费并行度；死信 topic 命名 <topic>.<消费组>.dlq
apiVersion: batch/v1
kind: Job
metadata:
  name: kafka-topics
  namespace: middleware
spec:
  backoffLimit: 20
  template:
    spec:
      restartPolicy: OnFailure
      enableServiceLinks: false
      containers:
        - name: topics
          image: apache/kafka:4.1.0
          command:
            - sh
            - -c
            - |
              set -e
              B=kafka.middleware.svc.cluster.local:9092
              for t in acme.order.events:3 acme.order.events.notification-service.dlq:1; do
                /opt/kafka/bin/kafka-topics.sh --bootstrap-server $B --create --if-not-exists \
                  --topic "${t%%:*}" --partitions "${t##*:}" --replication-factor 1
              done
              /opt/kafka/bin/kafka-topics.sh --bootstrap-server $B --describe --topic acme.order.events
          env:
            - { name: KAFKA_HEAP_OPTS, value: "-Xmx128m" }
