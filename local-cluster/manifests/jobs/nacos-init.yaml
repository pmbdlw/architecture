# 初始化 Nacos：设置管理员密码 → 创建命名空间 local → 发布本技术栈的配置（来自 ConfigMap nacos-configs）。
# 对应生产中“配置即代码”：deploy/nacos/<env>/*.yaml 由流水线发布到对应命名空间。
apiVersion: batch/v1
kind: Job
metadata:
  name: nacos-init
  namespace: middleware
spec:
  backoffLimit: 30
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: init
          image: curlimages/curl:8.16.0
          env:
            - name: NACOS_PASSWORD
              valueFrom:
                secretKeyRef: { name: nacos-auth, key: NACOS_ADMIN_PASSWORD }
          command:
            - sh
            - -c
            - |
              set -eu
              N=http://nacos.middleware.svc.cluster.local
              until curl -sf "$N:8080/v3/console/health/readiness" >/dev/null; do echo "等待 Nacos…"; sleep 3; done
              # 首次启动设置管理员密码（已设置时返回 409，忽略）
              curl -s -X POST "$N:8080/v3/auth/user/admin" -d "password=$NACOS_PASSWORD" >/dev/null || true
              TOKEN=$(curl -sf -X POST "$N:8848/nacos/v3/auth/user/login" -d username=nacos -d "password=$NACOS_PASSWORD" \
                | sed -n 's/.*"accessToken":"\([^"]*\)".*/\1/p')
              [ -n "$TOKEN" ] || { echo "登录 Nacos 失败"; exit 1; }
              # 命名空间 = 环境
              curl -s -X POST "$N:8848/nacos/v3/admin/core/namespace" -H "accessToken: $TOKEN" \
                -d namespaceId=local -d namespaceName=local --data-urlencode "namespaceDesc=本地集群" >/dev/null || true
              for f in /configs/*.yaml; do
                id=$(basename "$f")
                curl -sf -X POST "$N:8848/nacos/v3/admin/cs/config" -H "accessToken: $TOKEN" \
                  --data-urlencode "dataId=$id" -d groupName=DEFAULT_GROUP -d namespaceId=local -d type=yaml \
                  --data-urlencode "content@$f" >/dev/null
                echo "已发布 local/DEFAULT_GROUP/$id"
              done
          volumeMounts:
            - { name: configs, mountPath: /configs }
      volumes:
        - name: configs
          configMap: { name: nacos-configs }
