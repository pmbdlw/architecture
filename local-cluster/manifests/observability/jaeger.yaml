# Jaeger 2（OTLP 接收 + 内存存储 + UI）。生产：OTel Collector → Tempo / Jaeger + ES / 阿里云 ARMS。
# UI：http://localhost:30686
apiVersion: v1
kind: Service
metadata:
  name: jaeger
  namespace: observability
spec:
  type: NodePort
  selector: { app: jaeger }
  ports:
    - { name: otlp-grpc, port: 4317 }
    - { name: otlp-http, port: 4318 }
    - { name: ui, port: 16686, nodePort: 30686 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaeger
  namespace: observability
spec:
  replicas: 1
  selector:
    matchLabels: { app: jaeger }
  template:
    metadata:
      labels: { app: jaeger }
    spec:
      containers:
        - name: jaeger
          image: jaegertracing/jaeger:2.11.0
          ports:
            - { name: otlp-grpc, containerPort: 4317 }
            - { name: otlp-http, containerPort: 4318 }
            - { name: ui, containerPort: 16686 }
          readinessProbe:
            httpGet: { path: /, port: ui }
            periodSeconds: 5
          resources:
            requests: { cpu: 50m, memory: 256Mi }
            limits: { memory: 768Mi }
