# 本地集群公共覆盖项：与 acme-go/deploy/helm/acme-service/values.yaml 合并（只写差异）。
# 结构与 deploy/gitops/envs/<env>/*.yaml 相同，相当于多了一个 local 环境。
env: local                       # APP_ENV=local、NACOS_NAMESPACE=local

image:
  pullPolicy: IfNotPresent       # 镜像由 build.sh 构建并 kind load 到节点，不访问镜像仓库

replicaCount: 2
autoscaling:
  enabled: false

resources:
  requests:
    cpu: 50m
    memory: 96Mi
  limits:
    memory: 128Mi

# 本地加快发布节奏；生产保持默认（preStop 10s、优雅期 60s）
preStopSleepSeconds: 3
terminationGracePeriodSeconds: 20

secretName: ""                   # 各服务文件中指定

serviceMonitor:
  enabled: false                 # 本地 Prometheus 按 Pod 注解发现
podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "8081"
  prometheus.io/path: /metrics

networkPolicy:
  enabled: true
  allowFromNamespaces: [observability]

extraEnv:
  TRACING_SAMPLING_PROBABILITY: "1.0"
