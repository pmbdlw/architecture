# golangci-lint v2 配置：团队统一的静态检查规则（make lint）
version: "2"
linters:
  enable:
    - bodyclose
    - errorlint
    - gosec
    - misspell
    - nilerr
    - revive
    - sqlclosecheck
    - unconvert
  settings:
    revive:
      rules:
        - name: exported
          disabled: true
  exclusions:
    paths:
      - api/
    rules:
      # 测试代码中关闭响应体 / 资源的错误无需检查
      - path: _test\.go
        linters: [errcheck, bodyclose]
formatters:
  enable:
    - gofmt
    - goimports
