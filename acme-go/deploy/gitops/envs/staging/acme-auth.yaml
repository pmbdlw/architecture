# 预发布环境：与生产同构（同样的拓扑、同样的配置项、脱敏后的生产数据），用于上线前回归与压测。
# 由 Argo CD ApplicationSet 读取，与 deploy/helm/acme-service/values.yaml 合并。

appName: acme-auth
env: staging

image:
  repository: registry.acme.com/acme-go/acme-auth
  tag: "3f9c2ab"

autoscaling:
  minReplicas: 2
  maxReplicas: 4

resources:
  requests:
    cpu: 200m
    memory: 256Mi
  limits:
    memory: 256Mi

secretName: acme-auth-secrets  # JWK 私钥文件路径与客户端密钥

extraEnv:
  TRACING_SAMPLING_PROBABILITY: "1.0"
  NACOS_ENABLED: "false"

ingress:
  enabled: true
  # 自建：ingress-nginx；阿里云 ACK 改为 alb 并使用 alb.ingress.kubernetes.io/* 注解
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: acme-ca
  hosts:
    - host: auth.staging.acme.com
      path: /
  tls:
    - secretName: acme-auth-tls
      hosts:
        - auth.staging.acme.com
