# 预发布环境：与生产同构（同样的拓扑、同样的配置项、脱敏后的生产数据），用于上线前回归与压测。
# 由 Argo CD ApplicationSet 读取，与 deploy/helm/acme-service/values.yaml 合并。

appName: order-service
env: staging

image:
  repository: registry.acme.com/acme-go/order-service
  tag: "3f9c2ab"

autoscaling:
  minReplicas: 2
  maxReplicas: 4

resources:
  requests:
    cpu: 200m
    memory: 256Mi
  limits:
    memory: 256Mi

secretName: order-service-secrets  # DB_DSN、NACOS_PASSWORD 等，由 ExternalSecret 生成

extraEnv:
  TRACING_SAMPLING_PROBABILITY: "1.0"
