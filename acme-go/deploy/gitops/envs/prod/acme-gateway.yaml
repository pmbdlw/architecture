# 生产环境：多可用区、按 digest 部署、人工确认同步（Argo CD manual sync）。
# 由 Argo CD ApplicationSet 读取，与 deploy/helm/acme-service/values.yaml 合并。

appName: acme-gateway
env: prod

image:
  repository: registry.acme.com/acme-go/acme-gateway
  tag: "3f9c2ab"
  digest: "sha256:<CI 写入镜像 digest>"

autoscaling:
  minReplicas: 3
  maxReplicas: 20

resources:
  requests:
    cpu: 500m
    memory: 512Mi
  limits:
    memory: 512Mi

secretName: acme-gateway-secrets  # REDIS_PASSWORD

extraEnv:
  TRACING_SAMPLING_PROBABILITY: "0.1"
  NACOS_ENABLED: "true"

ingress:
  enabled: true
  # 自建：ingress-nginx；阿里云 ACK 改为 alb 并使用 alb.ingress.kubernetes.io/* 注解
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: acme-ca
  hosts:
    - host: api.acme.com
      path: /
  tls:
    - secretName: acme-gateway-tls
      hosts:
        - api.acme.com
