# 生产灰度示例：与稳定版同名服务（appName 相同），额外部署一组带 grayTag 的 Pod。
# 网关按 gateway.gray 规则给请求打 X-Gray-Tag: v2，灰度选择器只把这部分流量导向本组 Pod，
# 服务间 gRPC 调用透传该标签，实现全链路灰度。验证通过后更新稳定版镜像并删除本文件。
appName: order-service
env: prod
grayTag: v2

image:
  repository: registry.acme.com/acme-go/order-service
  tag: "7c41d09"
  digest: "sha256:<CI 写入镜像 digest>"

autoscaling:
  enabled: false
replicaCount: 1

service:
  enabled: false

resources:
  requests:
    cpu: 500m
    memory: 512Mi
  limits:
    memory: 512Mi

secretName: order-service-secrets
extraEnv:
  TRACING_SAMPLING_PROBABILITY: "1.0"
