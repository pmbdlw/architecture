{{- if .Values.service.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "acme.name" . }}
  labels:
    {{- include "acme.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "acme.serviceSelector" . | nindent 4 }}
  ports:
    - name: http
      port: 80
      targetPort: http
      {{- if and (eq .Values.service.type "NodePort") .Values.service.nodePort }}
      # 仅本地集群使用：固定 NodePort，配合 kind extraPortMappings 从宿主机直接访问
      nodePort: {{ .Values.service.nodePort }}
      {{- end }}
    - name: grpc
      port: {{ .Values.ports.grpc }}
      targetPort: grpc
    - name: management
      port: {{ .Values.ports.management }}
      targetPort: management
{{- end }}
