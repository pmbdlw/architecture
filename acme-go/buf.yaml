# 服务契约：api/ 下的 proto 文件（对外 HTTP 接口、集群内 gRPC 接口、领域事件）
version: v2
modules:
  - path: api
  - path: third_party
lint:
  # 第三方 proto（googleapis）不参与风格检查
  ignore:
    - third_party
  use:
    - STANDARD
  except:
    - RPC_REQUEST_RESPONSE_UNIQUE
    - RPC_RESPONSE_STANDARD_NAME
breaking:
  use:
    - FILE
