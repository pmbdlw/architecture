# 只写本服务特有的配置；平台默认值见 pkg/conf/defaults.yaml
app:
  name: user-service

server:
  # 本地开发端口；K8s 中统一由环境变量注入 HTTP_ADDR=:8080 / GRPC_ADDR=:9090 / MANAGEMENT_ADDR=:8081
  http:
    addr: ${HTTP_ADDR:0.0.0.0:8101}
  grpc:
    addr: ${GRPC_ADDR:0.0.0.0:9101}
  management:
    addr: ${MANAGEMENT_ADDR:0.0.0.0:7101}

data:
  database:
    dsn: ${DB_DSN:root:root@tcp(127.0.0.1:3306)/acme_user?parseTime=true&loc=UTC&charset=utf8mb4}
